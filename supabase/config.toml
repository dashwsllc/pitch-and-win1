project_id = "mbzwchnxtskysqplqiyy"

[auth]
site_url = "https://wsltda.site"
additional_redirect_urls = ["https://www.wsltda.site", "http://localhost:5173", "http://localhost:8080"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 2
sms_sent = 10
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 10
token_verifications = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "5m"

[storage]
file_size_limit = "2MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "2MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[functions.executive-update-account]
verify_jwt = true

[functions.reset-user-password]
verify_jwt = true
